name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/make-icon.mjs
      # Supabase credentials live in repo secrets, never in the repo itself
      - run: |
          cat > web/config.js << EOF
          window.PANTRY_CONFIG = { url: "${{ secrets.SUPABASE_URL }}", anonKey: "${{ secrets.SUPABASE_ANON_KEY }}" };
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
